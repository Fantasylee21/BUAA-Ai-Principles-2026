# v3 loss + native Conflict oversampling (total Conflict count x2).
# Run scripts/prepare_resampled_sft_data.py before training.
### model
model_name_or_path: models/Qwen2.5-VL-3B-Instruct
trust_remote_code: true
flash_attn: fa2
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
upcast_layernorm: true
image_min_pixels: 3136
image_max_pixels: 1003520
video_min_pixels: 50176
video_max_pixels: 100352
video_fps: 2.0
video_maxlen: 64

### method
stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
freeze_vision_tower: true
freeze_multi_modal_projector: true
freeze_language_model: false

### dataset
dataset_dir: data/llamafactory/generated/resampled_2x
media_dir: .
dataset: affect_sft_vl_train_aligned,affect_sft_vl_train_conflict
mix_strategy: concat
streaming: false
eval_dataset: affect_sft_vl_val
template: qwen2_vl
cutoff_len: 8192
train_on_prompt: false
packing: false
overwrite_cache: false
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: output/sft/qwen25vl/qlora_sft_v4_resample2x
logging_steps: 5
save_strategy: epoch
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 1.0e-4
weight_decay: 0.01
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_steps: 20
max_grad_norm: 1.0
bf16: true
tf32: true
seed: 42
data_seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: epoch
eval_accumulation_steps: 1
load_best_model_at_end: false
metric_for_best_model: eval_loss
greater_is_better: false


prediction_loss_only: true

# Normalize each task before combining, independent of question length.
task_balanced_loss:
  emotion: 0.5
  uncertainty: 0.4
  remainder: 0.1
  conflict_multiplier: 2.0
